[project]
name = "gemma-forge"
version = "0.0.1"
description = "Air-gapped, agentic infrastructure remediation on the Dell PowerEdge XR7620. Gemma 4 + vLLM + Google ADK Ralph loops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ken Rollins" }]
keywords = ["llm", "agents", "vllm", "gemma", "edge-ai", "federal", "stig", "ralph-loop"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # Agent framework — pre-1.0, pin tightly and re-check release notes per phase
    "google-adk>=0.3.0,<0.5.0",
    # google.adk imports `deprecated` but under-declares it; pin explicitly so
    # a fresh install (CI) gets it.
    "Deprecated>=1.2,<2.0",

    # vLLM client (OpenAI-compatible REST via httpx; we deliberately do NOT use LiteLLM)
    "httpx[http2]>=0.27,<1.0",
    "openai>=1.40,<2.0",

    # Config + schemas
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",

    # SSH to the target VM(s)
    "asyncssh>=2.14,<3.0",

    # Observability — OTel-pure stack (Jaeger + Prometheus + Grafana).
    # NO Langfuse: see docs/adr/0007-otel-jaeger-prometheus-grafana.md.
    # Token accounting flows through the OpenTelemetry GenAI semantic
    # conventions (gen_ai.* attributes).
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp>=1.25,<2.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-semantic-conventions>=0.46b0",

    # NVML for GPU telemetry surfaced to the dashboard
    "nvidia-ml-py>=12.0,<13.0",

    # FastAPI surface for the web frontend
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=12.0,<14.0",

    # Postgres driver for the Episodic, Semantic projection, and
    # run event tiers. ADR-0016: shared Supabase Postgres, per-skill
    # schema. psycopg 3 (binary build) keeps install simple.
    "psycopg[binary,pool]>=3.2,<4.0",

    # Reflective tier — Graphiti on Neo4j (ADR-0016, Phase B). The
    # neo4j driver is pulled in transitively but pin it explicitly so
    # version drift is visible. We use Graphiti's storage and retrieval
    # primitives; the dream pass is built on top.
    "graphiti-core>=0.3,<1.0",
    "neo4j>=5.20,<6.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.9",  # pinned: lint results must match local + CI exactly
    "mypy==1.20.0",  # pinned: type-check results must match local + CI exactly
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "types-PyYAML",
]

# Host-operator tooling. Install with `pip install -e ".[infra]"` (or
# `[dev,infra]` for everything). Deliberately separate from `dev` and
# from runtime `dependencies` so the harness Docker image (Phase 6+)
# does NOT carry the model-download tooling. These deps are only
# needed on the box that downloads weights into /data/triton/weights/
# during Phase 1 host setup.
infra = [
    "huggingface_hub>=0.26,<1.0",
    "hf-transfer>=0.1.8,<1.0",  # accelerated parallel downloads for HF
]

[project.urls]
Homepage = "https://github.com/kenrollins/gemma-forge"
Repository = "https://github.com/kenrollins/gemma-forge"
Issues = "https://github.com/kenrollins/gemma-forge/issues"

[project.scripts]
gemma-forge = "gemma_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemma_forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: line length handled by formatter.
# RUF001-003: ambiguous-unicode warnings on intentional em-dash/typography in prose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from another test module and reused as test-function
# parameters read as redefinitions to ruff — a known false positive.
"tests/test_eviction.py" = ["F811"]

[tool.ruff.lint.isort]
# Deterministic first-party classification. ruff's `detect-same-package`
# auto-detection resolves differently when gemma_forge is pip-installed (CI)
# vs. a local source dir, causing I001 import-sort disagreements between
# local and CI. Pin it explicitly so both agree.
known-first-party = ["gemma_forge"]
detect-same-package = false

[tool.mypy]
python_version = "3.12"  # match the runtime (CI + host run 3.12); parse 3.12-syntax installed stubs
# Right-sized from full `strict` (over-aspirational for a research harness):
# real type-bug detection stays on (union-attr, arg-type, attr-defined,
# return-value, assignment — all mypy defaults, reinforced by check_untyped_defs).
# The exhaustive-annotation flags (disallow_any_generics / disallow_untyped_defs /
# disallow_untyped_calls) that produced ~165 of 232 errors without catching a bug
# are dropped.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Heavy untyped scientific deps: don't analyze their internals. Insulates the
# build from third-party stub drift across versions (e.g. numpy shipping
# 3.12-syntax stubs that break under an older target).
[[tool.mypy.overrides]]
module = ["numpy.*", "sentence_transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: integration tests requiring real LLM + VM; use --run-slow to include",
]
