# GemmaForge Skill: Detection Engineering — Sigma Rule Tuning
#
# Third skill. Structurally different from STIG/CVE: statistical
# thresholds (precision/recall/F1) instead of binary pass/fail; the
# "fix" output is a tuned rule spec, not a system-state change.
#
# See futures/detection-tuning-skill.md (the proposal) and
# futures/detection-tuning-preflight.md (the execution plan).

name: "detection-tuning"
description: "Autonomous Sigma rule tuning against labeled threat-telemetry corpora. Worker proposes rule modifications; evaluator runs the candidate against ground-truth events and returns precision/recall/F1."
version: "0.0.1"
target_os: "n/a — corpus-based, no VM target"
status: friday-night-slice

# How the harness instantiates this skill's runtime (manifest-driven
# dispatch; matches stig-rhel9 / cve-response shape after the
# 9ff8688 refactor on main).
runtime:
  module: runtime.py
  builder: build_runtime
  schema: detection      # Postgres schema for memory (tip pool, work_items, etc.)

prompts:
  architect: "prompts/architect.md"
  worker: "prompts/worker.md"
  auditor: "prompts/auditor.md"
  reflector: "prompts/reflector.md"

tools:
  architect:
    - run_corpus_scan
  worker:
    - apply_rule_change
  auditor:
    - check_eval_health

# No validators — the corpus is a static labeled dataset, not a running
# mission-critical app. Health for this skill is "the eval pipeline ran
# without exceptions" (asserted inside the Evaluator).
validators: []

detection:
  # SigmaHQ public rules — the upstream library Ralph tunes against.
  rules_repo: "/tmp/dt-rules/sigma"

  # Per-rule working copy lives here; Checkpoint snapshots are
  # text-level (read-the-file save/restore).
  rule_workdir: "/tmp/dt-work/rules"

  # PASS criterion (from the proposal — may be tuned per corpus later).
  pass_precision: 0.95
  pass_recall: 0.80

  # Default corpus when neither config/harness.yaml's detection.corpus
  # nor the DT_CORPUS environment variable is set. The same Sigma rules
  # score against whatever corpus is selected at runtime — that's the
  # corpus-as-input shape from ADR-0022.
  default_corpus: evtx-attack-samples

  # Available corpora. Each entry declares its loader format, source
  # path, and per-technique positive-event labeling. The labeling has
  # to be per-corpus because filename conventions differ — EVTX-
  # ATTACK-SAMPLES uses descriptive prefixes (CA_Mimikatz_*); SDS
  # uses tooling-prefixed names (empire_*, covenant_*, cmd_*) for
  # the same techniques. Without per-corpus keywords, Run 2 would
  # silently label zero positives and score every rule at R=0.
  corpora:
    evtx-attack-samples:
      format: evtx_csv
      path: "/tmp/dt-corpora/evtx/evtx_data.csv"
      keywords_by_technique:
        T1003.001:  # Credential dumping (LSASS / SAM / NTDS)
          - mimikatz
          - hashdump
          - lsass
          - memdump
          - credump
          - dumpert
          - andrewspecial
          - ppldump
          - hktl
        T1218.005:  # Mshta proxy execution
          - mshta
        T1059.005:  # Visual Basic interpreter
          - mshta

    sds:
      format: sds_ndjson
      path: "/tmp/dt-corpora/sds-extracted"
      keywords_by_technique:
        T1003.001:  # Credential dumping
          - mimikatz
          - lsass
          - hashdump
          - sam
          - ntds
          - dcsync
          - dumpert
          - lsadump
          - ninjacopy
          - rubeus
          - logonpasswords
        T1218.005:  # Mshta — extract defense_evasion subdir for hits
          - mshta
        T1059.005:
          - mshta
          - wscript
          - cscript

  # Curated work-item queue. Each entry is one Sigma rule the harness
  # will evaluate (and, if below threshold, hand to the Worker for tuning).
  #
  # Per-rule labeling now flows from the active corpus's
  # keywords_by_technique map, so work_items declare technique_id only.
  #
  # Picked by /tmp/dt-find-candidates.py scan over the windows/ subset
  # of SigmaHQ. Diversity exercised: process_access AND process_creation
  # logsources; rule_too_narrow + rule_too_noisy_and_narrow failure modes.
  work_items:
    - rule_path: "rules/windows/process_access/proc_access_win_lsass_memdump.yml"
      technique_id: "T1003.001"
      description: "LSASS process_access cred-dumping detection"
    - rule_path: "rules/windows/process_access/proc_access_win_lsass_dump_keyword_image.yml"
      technique_id: "T1003.001"
      description: "LSASS dump by suspicious image-name keyword"
    - rule_path: "rules/windows/process_creation/proc_creation_win_mshta_lethalhta_technique.yml"
      technique_id: "T1218.005"
      description: "MSHTA LethalHTA injection technique"
    - rule_path: "rules/windows/process_creation/proc_creation_win_mshta_inline_vbscript.yml"
      technique_id: "T1059.005"
      description: "MSHTA inline VBScript execution"
    - rule_path: "rules/windows/process_creation/proc_creation_win_wscript_cscript_mshta_dropper.yml"
      technique_id: "T1059.005"
      description: "WSCRIPT/CSCRIPT/MSHTA dropper pattern"

ui:
  title: "Detection Tuning"
  work_item: "Sigma rule"
  work_item_plural: "Sigma rules"
  id_prefix_strip: ""
  fixed_label: "Tuned"
  outcomes:
    - { type: "fixed", label: "Tuned (PASS)", color: "#22C55E" }
    - { type: "escalated", label: "Escalated", color: "#EF4444" }
    - { type: "skipped", label: "Skipped", color: "#6B7280" }
